name: Build Madina Mart APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Madina Mart Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android project
        run: |
          echo "Checking Android project..."
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -d app
          test -f app/build.gradle.kts
          echo "Android project found."

      - name: Restore Gradle version catalog
        run: |
          mkdir -p gradle

          if [ ! -f gradle/libs.versions.toml ]; then
            cat > gradle/libs.versions.toml <<'EOF'
          [versions]
          agp = "8.7.3"
          kotlin = "2.0.21"
          coreKtx = "1.15.0"
          lifecycleRuntimeKtx = "2.8.7"
          activityCompose = "1.9.3"
          composeBom = "2024.11.00"
          navigationCompose = "2.8.4"
          lifecycleViewModelCompose = "2.8.7"
          playServicesLocation = "21.3.0"
          coilCompose = "2.7.0"
          gson = "2.11.0"
          materialIconsExtended = "1.7.5"
          datastorePreferences = "1.1.1"

          [libraries]
          androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
          androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
          androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
          androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
          androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
          androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
          androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
          androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
          androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
          androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }
          androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
          androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewModelCompose" }
          play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
          coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coilCompose" }
          gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
          androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
          kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
          EOF
          fi

          echo "Gradle version catalog ready."

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          echo "APK files generated:"
          find app/build/outputs/apk -type f -name "*.apk" -print
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Madina-Mart-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
